name: Sync Telegram posts

on:
  schedule:
    - cron: '17 * * * *' # ежечасно
  workflow_dispatch:

permissions:
  contents: write
  actions: write # запуск деплоя после импорта

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-telegram.mjs
      - name: Commit new posts
        id: commit
        run: |
          if git diff --quiet content/blog.json; then
            echo "Изменений нет"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/blog.json
          git commit -m "blog: автоимпорт постов из Telegram"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # Пуш от GITHUB_TOKEN не запускает другие workflow — поэтому деплой
      # вызывается явно: workflow_dispatch входит в исключения из этого правила
      - name: Trigger deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
